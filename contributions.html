<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contributions | StreetFit</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
</head>

<body>
    <div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
    <div class="mobile-header-fix">
        <div class="header-spacer"></div>
        <h2 style="font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; color: var(--primary);">StreetFit</h2>
        <div class="profile-container">
            <div class="profile-btn" onclick="document.getElementById('userRoleBadgeMobile').classList.toggle('show')">
                <i class="fas fa-user-circle"></i>
            </div>
            <div id="userRoleBadgeMobile" class="badge badge-approved">Admin</div>
        </div>
    </div>

    <div class="app-container">
        <nav class="sidebar" id="sidebar">
            <div class="brand-area" style="margin-bottom: 2rem; padding: 0 1rem;">
                <h2 style="color: white;">StreetFit</h2>
            </div>
            <a href="index.html" class="nav-link"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="contributions.html" class="nav-link active"><i class="fas fa-hand-holding-usd"></i>
                Contributions</a>
            <a href="expenses.html" class="nav-link"><i class="fas fa-receipt"></i> Expenses</a>
            <a href="plans.html" class="nav-link"><i class="fas fa-tasks"></i> Plans</a>
            <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border);">
                <!-- Partner Login -->
                <a href="auth.html" id="adminLoginBtn" class="btn btn-ghost">
                    <i class="fas fa-users"></i> Partner Login
                </a>
                <a href="auth.html" id="adminPortalBtn" class="btn btn-ghost">
                    <i class="fas fa-user-shield"></i> Admin Access
                </a>
                <button onclick="window.auth.logout()" class="btn btn-ghost" style="color: #ef4444;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </nav>

        <main class="main-content">
            <header class="flex-between" style="margin-bottom: 2rem;">
                <h1>Contributions</h1>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <button class="btn btn-primary admin-only hidden" style="width: auto;"
                        onclick="showModal('addContributionModal')">
                        <i class="fas fa-plus"></i> Add
                    </button>
                    <div class="profile-container hide-mobile">
                        <div class="profile-btn"
                            onclick="document.getElementById('userRoleBadge').classList.toggle('show')">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div id="userRoleBadge" class="badge badge-approved">Admin</div>
                    </div>
                </div>
            </header>

            <div class="card">
                <h3>Partner Breakdown</h3>
                <div id="partnerList" style="margin-top: 1rem;">
                    <!-- Dynamically populated -->
                </div>
            </div>

            <div class="card">
                <h3>Recent Contributions</h3>
                <div id="contributionHistory" style="margin-top: 1rem;">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="addContributionModal" class="hidden"
        style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1100; display: flex; align-items: center; justify-content: center; padding: 1rem;">
        <div class="card" style="width: 100%; max-width: 400px; margin-bottom: 0;">
            <h3>Add Contribution</h3>
            <form id="contribForm" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>Partner Name (Username)</label>
                    <input type="text" id="partnerUsername" required placeholder="Ex: Kumar, Pavithran">
                </div>
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="contribAmount" required placeholder="5000">
                </div>
                <div class="flex-between" style="gap: 1rem;">
                    <button type="button" class="btn btn-ghost"
                        onclick="hideModal('addContributionModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Contribution Modal -->
    <div id="editContributionModal" class="hidden"
        style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1100; display: flex; align-items: center; justify-content: center; padding: 1rem;">
        <div class="card" style="width: 100%; max-width: 400px; margin-bottom: 0;">
            <h3>Edit Contribution</h3>
            <form id="editContribForm" style="margin-top: 1rem;">
                <input type="hidden" id="editContribId">
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="editAmount" required>
                </div>
                <div class="flex-between" style="gap: 1rem;">
                    <button type="button" class="btn btn-ghost"
                        onclick="hideModal('editContributionModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item"><i class="fas fa-chart-line"></i><span>Dash</span></a>
        <a href="expenses.html" class="bottom-nav-item"><i class="fas fa-receipt"></i><span>Exp</span></a>
        <a href="plans.html" class="bottom-nav-item"><i class="fas fa-tasks"></i><span>Plans</span></a>
        <a href="contributions.html" class="bottom-nav-item active"><i
                class="fas fa-hand-holding-usd"></i><span>Contribs</span></a>
    </nav>

    <script src="supabase.js"></script>
    <script src="app.js"></script>
    <script>
        async function loadContributions() {
            const user = await checkAuth();

            const { data: contribs } = await window.db.getContributions();
            const { data: profiles } = await window.db.getProfiles();

            if (!contribs || !profiles) return;

            if (profiles && contribs) {
                const partnerList = document.getElementById('partnerList');
                partnerList.innerHTML = profiles.filter(p => p.role === 'partner').map(p => {
                    // Match by username as it's proven to work in the history section below
                    const total = contribs
                        .filter(c => c.profiles?.username === p.username)
                        .reduce((sum, c) => sum + c.amount, 0);

                    const capitalized = p.username.charAt(0).toUpperCase() + p.username.slice(1);
                    return `
                        <div class="flex-between" style="padding: 0.75rem 0; border-bottom: 1px solid var(--border);">
                            <span>${capitalized}</span>
                            <span style="font-weight: 700; color: ${total > 0 ? 'var(--primary)' : 'var(--text-muted)'};">
                                ₹${total.toLocaleString()}
                            </span>
                        </div>
                    `;
                }).join('');
            }

            const isAdmin = user && user.profile && user.profile.role === 'admin';
            const history = document.getElementById('contributionHistory');
            history.innerHTML = contribs.sort((a, b) => new Date(b.date) - new Date(a.date)).map(c => {
                const capitalized = (c.profiles?.username || '').charAt(0).toUpperCase() + (c.profiles?.username || '').slice(1);
                return `
                    <div class="flex-between" style="padding: 0.75rem 0; border-bottom: 1px solid var(--border); font-size: 0.875rem;">
                        <div>
                            <div style="font-weight: 600;">₹${c.amount.toLocaleString()}</div>
                            <div style="color: var(--text-muted);">${new Date(c.date).toLocaleDateString()} - ${capitalized}</div>
                        </div>
                        ${isAdmin ? `
                        <div style="display: flex; gap: 0.5rem;">
                            <button class="btn btn-ghost" style="width: auto; min-height: auto; padding: 0.25rem; color: var(--accent);" onclick="openEditContribModal('${c.id}', ${c.amount})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-ghost" style="width: auto; min-height: auto; padding: 0.25rem; color: var(--danger);" onclick="deleteContrib('${c.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        async function deleteContrib(id) {
            if (!confirm('Are you sure you want to delete this contribution?')) return;
            const { error } = await window.db.deleteContribution(id);
            if (error) alert('Error: ' + error.message);
            else loadContributions();
        }

        function openEditContribModal(id, amount) {
            document.getElementById('editContribId').value = id;
            document.getElementById('editAmount').value = amount;
            showModal('editContributionModal');
        }

        async function deletePartner(id) {
            if (!confirm('Are you sure you want to delete this partner profile? This may cause issues with their linked data.')) return;
            const { error } = await window.db.deleteProfile(id);
            if (error) alert('Error: ' + error.message);
            else {
                // Also might want to refresh profile list if we had one
                loadContributions();
            }
        }

        document.getElementById('contribForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('partnerUsername').value;
            const amount = parseFloat(document.getElementById('contribAmount').value);

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';

            try {
                // Find account ID for this username
                const { data: profile } = await window.db.getProfileByUsername(username);

                if (!profile) {
                    alert(`Error: Account for "${username}" not found. They must Sign Up first.`);
                    return;
                }

                const { error } = await window.db.addContribution(profile.id, amount);
                if (error) throw error;

                hideModal('addContributionModal');
                loadContributions();
            } catch (err) {
                console.error(err);
                alert('Failed to save contribution: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save';
            }
        });

        document.getElementById('editContribForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editContribId').value;
            const amount = parseFloat(document.getElementById('editAmount').value);

            await window.db.updateContribution(id, amount);
            hideModal('editContributionModal');
            loadContributions();
        });

        window.addEventListener('load', loadContributions);
    </script>
</body>

</html>
