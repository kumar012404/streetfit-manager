<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Team | StreetFit Business Manager</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='black'/%3E%3Cdefs%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23FFD700;stop-opacity:1' /%3E%3Cstop offset='50%25' style='stop-color:%23D4AF37;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23B8860B;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='50%25' y='72%25' text-anchor='middle' font-family='Outfit, Arial Black, sans-serif' font-weight='900' font-size='60' font-style='italic' fill='url(%23gold)' style='filter:drop-shadow(2px 2px 2px rgba(0,0,0,0.5))'%3ESF%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="brand-area">
                <h2>StreetFit</h2>
            </div>
            <a href="index.html" class="nav-link"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="contributions.html" class="nav-link"><i class="fas fa-hand-holding-usd"></i> Contributions</a>
            <a href="expenses.html" class="nav-link"><i class="fas fa-receipt"></i> Expenses</a>
            <a href="plans.html" class="nav-link"><i class="fas fa-tasks"></i> Plans</a>
            <a href="team.html" class="nav-link active admin-only hidden"><i class="fas fa-users-cog"></i> Manage
                Team</a>

            <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border);">
                <button id="logoutBtn" onclick="window.auth.logout()" class="btn btn-ghost"
                    style="color: #ef4444; width: 100%; text-align: left; padding: 0.75rem 1rem;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="flex-between" style="margin-bottom: 2rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-ghost" id="menuToggle" style="padding: 0.5rem; width: auto;"><i
                            class="fas fa-bars"></i></button>
                    <h1>Manage Team</h1>
                </div>
            </header>

            <div class="card">
                <h3>Team Members</h3>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">
                    Promote partners to Admin to let them approve expenses and manage finances.
                </p>
                <div id="teamList" style="display: flex; flex-direction: column; gap: 1rem;">
                    <div style="text-align: center; color: var(--text-muted); padding: 2rem;">Loading team members...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bottom Nav (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Dash</span>
        </a>
        <a href="expenses.html" class="bottom-nav-item">
            <i class="fas fa-receipt"></i>
            <span>Exp</span>
        </a>
        <a href="plans.html" class="bottom-nav-item">
            <i class="fas fa-tasks"></i>
            <span>Plans</span>
        </a>
        <a href="team.html" class="bottom-nav-item active admin-only hidden">
            <i class="fas fa-users-cog"></i>
            <span>Team</span>
        </a>
        <a href="contributions.html" class="bottom-nav-item">
            <i class="fas fa-hand-holding-usd"></i>
            <span>Contribs</span>
        </a>
    </nav>

    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        async function loadTeam() {
            const user = await checkAuth();
            if (!user || user.profile?.role !== 'admin') {
                window.location.href = 'index.html';
                return;
            }

            const { data: profiles } = await window.db.getProfiles();
            if (!profiles) return;

            const teamList = document.getElementById('teamList');
            teamList.innerHTML = profiles.sort((a, b) => (a.username || '').localeCompare(b.username)).map(p => {
                const isSelf = p.id === user.id;
                const isAdmin = p.role === 'admin';
                const capitalized = (p.username || 'Unknown').charAt(0).toUpperCase() + (p.username || 'Unknown').slice(1);

                return `
                    <div class="card" style="margin-bottom: 0; padding: 1rem; border: 1px solid ${isAdmin ? 'var(--accent)' : 'var(--border)'}; background: ${isAdmin ? 'rgba(59, 130, 246, 0.05)' : 'white'};">
                        <div class="flex-between">
                            <div style="display: flex; align-items: center; gap: 1rem;">
                                <div style="width: 40px; height: 40px; border-radius: 50%; background: ${isAdmin ? 'var(--accent)' : 'var(--border)'}; display: flex; align-items: center; justify-content: center; color: white;">
                                    <i class="fas ${isAdmin ? 'fa-user-shield' : 'fa-user'}"></i>
                                </div>
                                <div>
                                    <div style="font-weight: 700;">${capitalized} ${isSelf ? '<span style="color: var(--primary); font-size: 0.75rem;">(You)</span>' : ''}</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);">${isAdmin ? 'Administrator' : 'Partner'}</div>
                                </div>
                            </div>
                            
                            ${!isSelf ? `
                                <button class="btn btn-ghost" 
                                    style="width: auto; min-height: auto; padding: 0.5rem 1rem; font-size: 0.875rem; border: 1px solid ${isAdmin ? 'var(--danger)' : 'var(--accent)'}; color: ${isAdmin ? 'var(--danger)' : 'var(--accent)'};"
                                    onclick="toggleAdminRole('${p.id}', '${capitalized}', ${isAdmin})">
                                    ${isAdmin ? 'Revoke Admin' : 'Make Admin'}
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function toggleAdminRole(uid, name, isAdmin) {
            const action = isAdmin ? 'revoke Admin access from' : 'promote';
            const targetRole = isAdmin ? 'partner' : 'admin';

            if (!confirm(`Are you sure you want to ${action} "${name}"?`)) return;

            const { error } = await window.auth.updateUserRole(uid, targetRole);
            if (error) alert('Error: ' + error.message);
            else {
                alert(`Success! ${name} is now a ${targetRole}.`);
                loadTeam();
            }
        }

        window.addEventListener('load', loadTeam);
    </script>
</body>

</html>
